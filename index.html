<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Servidor Oracle Cloud</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 40px;
            font-size: 32px;
            color: #38bdf8;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Espaçamento maior entre os botões */
            width: 100%;
            max-width: 360px; /* Botões um pouco mais largos */
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 24px;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            border-radius: 16px; /* Bordas mais arredondadas */
            font-weight: 600;
            font-size: 18px;
            border: 2px solid transparent; /* Borda invisível por padrão */
            transition: all 0.3s ease-in-out;
            box-shadow: 0 6px 10px -1px rgba(0, 0, 0, 0.2);
        }
        .btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.4);
        }
        /* Ícones dentro dos botões */
        .btn::before {
            margin-right: 12px;
            font-size: 20px;
        }
        .btn-immich::before { content: '📸'; }
        .btn-files::before { content: '📁'; }

    </style>
</head>
<body>

    <h1>Meus Serviços</h1>

    <div class="container">
        <!-- Botão Immich -->
        <a href="https://player-semi-aluminum-committees.trycloudflare.com" class="btn btn-immich" target="_blank">Immich (Fotos)</a>
        
        <!-- Botão File Browser (Adicione o seu link do Cloudflare aqui) -->
        <a href="https://ruby-became-eds-webcast.trycloudflare.com" target="_blank">File Browser (Arquivos)</a>
    </div>

</body>
</html>
