<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Projetos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding-top: 80px;
        }
        /* Botão de voltar fixo no topo */
        .btn-voltar {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            background-color: #1e293b;
            color: #38bdf8;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #334155;
            transition: 0.2s;
        }
        .btn-voltar:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        h1 {
            font-size: 32px;
            color: #38bdf8;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 360px;
        }
        .btn-projeto {
            display: block;
            padding: 18px;
            background-color: #1e293b;
            color: #f8fafc;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 18px;
            text-align: center;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .btn-projeto:hover {
            background-color: #10b981; /* Cor verde para destacar jogos/projetos */
            color: #0f172a;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Botão de voltar para a tela anterior -->
    <a href="index.html" class="btn-voltar">← Voltar</a>

    <h1>Meus Projetos</h1>

    <div class="container">
        <!-- Clicar aqui leva para a tela do Projeto 1 -->
        <a href="GoblinSlayer.html" class="btn-projeto">Goblin Slayer</a>
    </div>

</body>
</html>
