<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin Slayer - Jogo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Evita barra de rolagem na página principal também */
        }
        .btn-voltar {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            background-color: #1e293b;
            color: #38bdf8;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #334155;
            transition: 0.2s;
        }
        .btn-voltar:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        /* Estilo para o título na tela */
        h1 {
            font-size: 28px;
            color: #38bdf8;
            margin-bottom: 15px;
            margin-top: 0;
        }
        /* Container do jogo com overflow hidden para cortar qualquer excesso */
        .game-container {
            width: 960px;
            height: 540px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden; /* ESSA É A CHAVE: Esconde qualquer barra que o iframe tente criar */
            border: 2px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .game-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Botão de voltar para a tela de lista de projetos -->
    <a href="Projetos.html" class="btn-voltar">← Voltar para Projetos</a>

    <!-- Título visível na tela -->
    <h1>Goblin Slayer</h1>

    <!-- Aqui é onde a build do seu jogo vai rodar -->
    <div class="game-container">
        <iframe src="Projetos/Goblin Slayer/index.html" allowfullscreen="true"></iframe>
    </div>

</body>
</html>
