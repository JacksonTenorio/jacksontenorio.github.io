<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goblin Slayer - Jogo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .btn-voltar {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            background-color: #1e293b;
            color: #38bdf8;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            border: 1px solid #334155;
            transition: 0.2s;
        }
        .btn-voltar:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        /* Estilo para o título na tela */
        h1 {
            font-size: 32px;
            color: #38bdf8;
            margin-bottom: 20px;
            margin-top: 0;
        }
        .game-container {
            width: 80%;
            max-width: 800px;
            height: 450px;
            background-color: #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
            color: #64748b;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Botão de voltar para a tela de lista de projetos -->
    <a href="Projetos.html" class="btn-voltar">← Voltar para Projetos</a>

    <!-- Título visível na tela -->
    <h1>Goblin Slayer</h1>

    <!-- Aqui é onde a build do seu jogo (ex: WebGL) vai rodar -->
    <div class="game-container">
        [ Sua Build / Jogo rodará aqui ]
    </div>

</body>
</html>
